name: Commute Weather Alert

on:
  # No `schedule:` trigger here on purpose: GitHub's own cron scheduler
  # proved unreliable for this workflow (observed running 4.5-5 hours
  # late, repeatedly). Nightly runs are instead triggered on time by an
  # external cron service calling this workflow's dispatch API — see the
  # "Reliable exact-time triggering" section in the README. This event
  # is what that external call (and the manual "Run workflow" button)
  # both use.
  workflow_dispatch: {}

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check commute weather and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/commute-weather-alert.mjs
