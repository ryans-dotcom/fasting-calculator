name: Commute Weather Alert

on:
  schedule:
    # Targets ~22:00 America/Chicago during CDT (UTC-5); drifts to ~21:00
    # during CST (UTC-6, roughly Nov-Mar). GitHub's schedule trigger is
    # also best-effort and can run behind — the script always sends
    # regardless of exactly when it fires, rather than silently skipping.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check commute weather and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/commute-weather-alert.mjs
